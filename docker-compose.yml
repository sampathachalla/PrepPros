name: preppros

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
      target: database
    container_name: preppros-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-preppros}
      POSTGRES_USER: ${POSTGRES_USER:-preppros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-preppros_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [preppros]

  hermes-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: hermes-agent
    container_name: preppros-hermes-agent
    restart: unless-stopped
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      MODEL_NAME: ${MODEL_NAME:-nous-hermes2-mixtral}
      MODEL_API_KEY: ${MODEL_API_KEY:-ollama}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AGENT_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [preppros]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: preppros-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-preppros}:${POSTGRES_PASSWORD:-preppros_dev_password}@db:5432/${POSTGRES_DB:-preppros}
      AGENT_URL: http://hermes-agent:8001
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      hermes-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [preppros]

volumes:
  postgres_data:

networks:
  preppros:
    driver: bridge
